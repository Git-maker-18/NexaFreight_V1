services:
  - type: web
    name: nexafreight-backend
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/rajmontana/nexafreight-backend:latest-amd64
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ENABLE_BACKGROUND_SCHEDULER
        value: "true"
      - key: ENABLE_AIS_LISTENER
        value: "true"
      - key: ENABLE_POSITION_INTERPOLATOR
        value: "true"
      - key: ENABLE_DISRUPTION_DETECTOR
        value: "true"
      - key: ENABLE_SLA_CHECKER
        value: "true"
