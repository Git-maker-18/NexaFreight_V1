services:
  - type: web
    name: nexafreight-backend
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/rajmontana/nexafreight-backend:latest-amd64
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "false"
