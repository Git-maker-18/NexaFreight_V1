name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Alembic schema
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
          DATABASE_PATH: ${{ runner.temp }}/ci-schema.db
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("${{ runner.temp }}/ci-schema.db")
          tables = {
              row[0]
              for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type = 'table'"
              )
          }
          assert "parameter_policy" in tables, tables
          PY

      - name: Run backend tests
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
        run: |
          pytest -q

  frontend-test:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run frontend tests (vitest)
        run: npx vitest run

      - name: Build frontend
        run: npm run build