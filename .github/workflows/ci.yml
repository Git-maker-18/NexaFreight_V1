name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Alembic schema
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
          DATABASE_PATH: ${{ runner.temp }}/ci-schema.db
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("${{ runner.temp }}/ci-schema.db")
          tables = {
              row[0]
              for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type = 'table'"
              )
          }
          assert "parameter_policy" in tables, tables
          PY

      - name: Run backend tests
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
        run: |
          pytest -q

      - name: Validate references (eval gate)
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
        run: |
          python eval/validate.py

      - name: Disruption drill (Red Sea replay)
        # Task 23: scripted disruption scenarios as CI — Suez vs Cape ratios
        # for 3 lane groups must stay inside the UNCTAD-anchored bands
        # (eval/references.yaml). Pure marine-graph computation, no DB.
        run: |
          python scripts/24_red_sea_drill.py

  frontend-test:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run frontend tests (vitest)
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  postgres-suite:
    name: Backend Postgres Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_password
          POSTGRES_DB: nexafreight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexafreight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Postgres Integration tests
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://nexa:nexa_password@localhost:5432/nexafreight
        run: |
          python -m alembic upgrade head
          pytest tests/integration -q

  docker-builds:
    name: Build Docker Images (${{ matrix.arch }})
    needs: [backend-test, frontend-test, postgres-suite]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64' && matrix.runner != 'ubuntu-24.04-arm'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: docker/Dockerfile.backend
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexafreight-backend:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: docker/Dockerfile.frontend
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexafreight-frontend:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test backend and frontend
        run: |
          docker run -d --name smoke-backend -p 8080:8000 \
            -e DATABASE_PATH=/tmp/smoke.db \
            -e JWT_SECRET=x \
            ghcr.io/${{ github.repository_owner }}/nexafreight-backend:latest-${{ matrix.arch }}
          
          timeout 60s bash -c 'until curl -s http://localhost:8080/healthz; do sleep 2; done'
          
          docker run -d --name smoke-frontend -p 3001:3000 \
            -e NEXT_PUBLIC_API_URL=http://localhost:8080 \
            ghcr.io/${{ github.repository_owner }}/nexafreight-frontend:latest-${{ matrix.arch }}
          
          sleep 5
          if ! docker inspect -f '{{.State.Running}}' smoke-frontend | grep -q true; then
            docker logs smoke-frontend
            exit 1
          fi