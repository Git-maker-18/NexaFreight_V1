services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_password
      POSTGRES_DB: nexafreight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexafreight"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+asyncpg://nexa:nexa_password@postgres:5432/nexafreight
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    environment:
      NEXA_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
